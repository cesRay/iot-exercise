[project]
name = "foco-bridge"
version = "0.1.0"
description = "Puente entre AWS IoT Core y un foco WiZ"
requires-python = ">=3.11"
dependencies = [
    "awsiotsdk>=1.31",
    "pywizlight>=0.6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foco_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
