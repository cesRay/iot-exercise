<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foco IoT</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Foco IoT</h1>
      <div id="foco" class="foco" role="img" aria-label="Estado del foco"></div>
      <p id="mensaje" class="mensaje" role="status"></p>
      <section class="controles">
        <button id="encendido" type="button">Encender</button>
        <label>Color <input id="color" type="color" value="#ffffff" /></label>
        <label>
          Brillo
          <input id="brillo" type="range" min="10" max="100" value="100" />
          <output id="brillo-valor">100</output>
        </label>
      </section>
      <dl class="estado">
        <dt>Conexión con AWS</dt>
        <dd id="estado-conexion">conectando…</dd>
        <dt>Gateway (Raspberry Pi)</dt>
        <dd id="estado-gateway">desconocido</dd>
        <dt>Foco</dt>
        <dd id="estado-foco">sin datos</dd>
      </dl>
    </main>
    <script type="module" src="js/app/index.js"></script>
  </body>
</html>
